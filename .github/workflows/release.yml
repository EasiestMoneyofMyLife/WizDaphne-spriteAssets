name: Release Assets

on:
  push:
    tags:
      - 'Ver*'
  workflow_dispatch:
    inputs:
      debug:
        description: '仅调试，不发布 Release'
        type: boolean
        default: true
      ref:
        description: '要调试的 tag 或分支'
        type: string
        default: 'main'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          lfs: true
          fetch-depth: 0

      - name: Verify repo structure
        run: |
          echo "=== 仓库根目录 ==="
          ls -la
          echo ""
          echo "=== Old/ 文件数 ==="
          find Old -type f 2>/dev/null | wc -l
          echo ""
          echo "=== 版本目录 ==="
          ls -d Ver*/ 2>/dev/null

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.ref }}"
          else
            VER="${GITHUB_REF_NAME}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "本次版本: $VER"

      - name: Debug only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug }}
        run: |
          echo "调试模式，跳过打包和发布"
          bash rebuild_full.sh "${{ steps.ver.outputs.version }}"
          echo ""
          echo "=== 重建产物 ==="
          for d in *_full/; do
            echo "$d 文件数: $(find "$d" -type f | wc -l)"
            echo "$d/deleted 文件数: $(find "$d/deleted" -type f 2>/dev/null | wc -l)"
          done

      - name: Rebuild full version
        if: ${{ github.event_name == 'push' || !inputs.debug }}
        run: bash rebuild_full.sh "${{ steps.ver.outputs.version }}"

      - name: Zip full assets
        if: ${{ github.event_name == 'push' || !inputs.debug }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          cd "${VER}_full"
          zip -r "../${VER}_full.zip" .
          cd ..

      - name: Zip new assets
        if: ${{ github.event_name == 'push' || !inputs.debug }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          zip -r "${VER}_new.zip" "${VER}/"

      - name: Create release and upload
        if: ${{ github.event_name == 'push' || !inputs.debug }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.version }}
          body: "${{ steps.ver.outputs.version }} 资源"
          files: |
            ${{ steps.ver.outputs.version }}_full.zip
            ${{ steps.ver.outputs.version }}_new.zip